<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zárate Audio</title>
    <style>
        /* Variables de diseño oscuro y acentos por categoría */
        :root {
            --bg-main: #0b0d10;
            --bg-card: #13161c;
            --bg-surface: #1a1e26;
            --border-subtle: #262b36;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-kz: #f59e0b;
            --accent-bt: #38bdf8;
            --accent-ok: #22c55e;
        }

        /* Reset y base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        button, input, select {
            font-family: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
        }

        /* Contenedor principal */
        .container {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 1.25rem;
        }

        /* Encabezado superior limpio */
        header {
            position: sticky;
            top: 0;
            z-index: 30;
            background-color: rgba(11, 13, 16, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.95rem 0;
        }

        .brand-logo {
            display: flex;
            align-items: baseline;
            gap: 0.45rem;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-decoration: none;
            color: var(--text-primary);
        }

        .brand-logo span {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .cart-trigger {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.55rem 0.95rem;
            border-radius: 10px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            font-size: 0.9rem;
            font-weight: 600;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .cart-trigger:hover {
            border-color: #3b4456;
            background-color: #202631;
        }

        .cart-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.35rem;
            height: 1.35rem;
            padding: 0 0.35rem;
            border-radius: 999px;
            background-color: var(--text-primary);
            color: var(--bg-main);
            font-size: 0.78rem;
            font-weight: 800;
        }

        /* Sección introductoria breve */
        .hero {
            padding: 2.25rem 0 1.25rem;
        }

        .hero h1 {
            font-size: clamp(1.65rem, 3.5vw, 2.35rem);
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.45rem;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 0.98rem;
            max-width: 620px;
        }

        /* Barra de filtros en una línea adaptable */
        .filters-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.85rem;
            padding: 1rem 0 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 1.75rem;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
        }

        .tab-btn {
            padding: 0.5rem 0.95rem;
            border-radius: 9px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-secondary);
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            transition: all 0.18s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            border-color: #384152;
        }

        .tab-btn.active[data-category="Todos"] {
            background-color: var(--text-primary);
            color: var(--bg-main);
            border-color: var(--text-primary);
        }

        .tab-btn.active[data-category="KZ"] {
            background-color: var(--accent-kz);
            color: #0b0d10;
            border-color: var(--accent-kz);
        }

        .tab-btn.active[data-category="Bluetooth"] {
            background-color: var(--accent-bt);
            color: #0b0d10;
            border-color: var(--accent-bt);
        }

        .controls-right {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.65rem;
            flex: 1 1 320px;
            justify-content: flex-end;
        }

        .search-input,
        .brand-select {
            height: 2.45rem;
            border-radius: 9px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            font-size: 0.88rem;
            padding: 0 0.8rem;
            transition: border-color 0.2s ease;
        }

        .search-input {
            flex: 1 1 190px;
            max-width: 260px;
        }

        .brand-select {
            min-width: 155px;
            cursor: pointer;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-input:focus,
        .brand-select:focus {
            outline: none;
            border-color: #4b5568;
        }

        /* Cuadrícula de productos */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
            gap: 1.25rem;
            padding-bottom: 3.5rem;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-3px);
            border-color: #353d4d;
        }

        /* Encuadre limpio de imagen con fondo oscuro sutil */
        .product-media {
            position: relative;
            height: 175px;
            background: radial-gradient(circle at 50% 45%, #1e2430 0%, #101318 100%);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        .product-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            opacity: 0.94;
        }

        .product-media svg {
            width: 108px;
            height: 108px;
        }

        .product-body {
            padding: 1rem 1.05rem 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            flex: 1;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.75rem;
        }

        .category-tag {
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            padding: 0.18rem 0.5rem;
            border-radius: 6px;
        }

        .tag-kz {
            color: var(--accent-kz);
            background-color: rgba(245, 158, 11, 0.13);
            border: 1px solid rgba(245, 158, 11, 0.32);
        }

        .tag-bt {
            color: var(--accent-bt);
            background-color: rgba(56, 189, 248, 0.13);
            border: 1px solid rgba(56, 189, 248, 0.32);
        }

        .product-brand {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .product-title {
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .product-spec {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: auto;
            padding-bottom: 0.35rem;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding-top: 0.7rem;
            border-top: 1px solid var(--border-subtle);
        }

        .product-price {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-spec {
            padding: 0.42rem 0.68rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        .btn-spec:hover {
            color: var(--text-primary);
            border-color: #3f495c;
        }

        .btn-add {
            padding: 0.42rem 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #0b0d10;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .btn-add:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-add-kz {
            background-color: var(--accent-kz);
        }

        .btn-add-bt {
            background-color: var(--accent-bt);
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
        }

        /* Pie de página simple */
        footer {
            border-top: 1px solid var(--border-subtle);
            padding: 1.5rem 0;
            color: var(--text-secondary);
            font-size: 0.84rem;
            text-align: center;
        }

        /* Modal de especificaciones */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-color: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(4px);
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
        }

        .modal-header h3 {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .close-btn {
            width: 2rem;
            height: 2rem;
            border-radius: 8px;
            display: grid;
            place-items: center;
            color: var(--text-secondary);
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            font-size: 1rem;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 1.25rem;
        }

        .modal-preview {
            height: 165px;
            border-radius: 12px;
            background: radial-gradient(circle at 50% 45%, #1e2430 0%, #0f1217 100%);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .modal-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .modal-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .specs-list {
            list-style: none;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
        }

        .specs-list li {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 0.6rem 0.75rem;
            font-size: 0.8rem;
        }

        .specs-list span {
            display: block;
            color: var(--text-secondary);
            font-size: 0.72rem;
            margin-bottom: 0.15rem;
        }

        .specs-list strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .modal-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding-top: 0.85rem;
            border-top: 1px solid var(--border-subtle);
        }

        .modal-price {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .modal-add-btn {
            padding: 0.65rem 1.15rem;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #0b0d10;
        }

        /* Carrito deslizable lateral */
        .drawer-backdrop {
            position: fixed;
            inset: 0;
            z-index: 45;
            display: none;
            background-color: rgba(0, 0, 0, 0.65);
        }

        .drawer-backdrop.open {
            display: block;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 50;
            width: 100%;
            max-width: 390px;
            height: 100vh;
            background-color: var(--bg-card);
            border-left: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.25s ease;
        }

        .cart-drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.05rem 1.2rem;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
        }

        .drawer-header h2 {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .drawer-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .cart-empty {
            text-align: center;
            color: var(--text-secondary);
            padding: 3rem 1rem;
            font-size: 0.92rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.8rem;
            border-radius: 12px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
        }

        .cart-item-info {
            min-width: 0;
            flex: 1;
        }

        .cart-item-name {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cart-item-sub {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .qty-btn {
            width: 1.65rem;
            height: 1.65rem;
            border-radius: 7px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            font-size: 0.88rem;
            font-weight: 700;
            display: grid;
            place-items: center;
        }

        .qty-btn:hover {
            border-color: #465063;
        }

        .qty-value {
            min-width: 1.3rem;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .remove-btn {
            margin-left: 0.25rem;
            color: var(--text-secondary);
            font-size: 0.82rem;
            padding: 0.25rem;
        }

        .remove-btn:hover {
            color: #f87171;
        }

        .drawer-footer {
            padding: 1.1rem 1.2rem 1.25rem;
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
        }

        .total-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.9rem;
            font-size: 1rem;
            font-weight: 700;
        }

        .total-amount {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .confirm-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            background-color: var(--text-primary);
            color: var(--bg-main);
            font-size: 0.92rem;
            font-weight: 800;
            transition: opacity 0.15s ease;
        }

        .confirm-btn:hover:not(:disabled) {
            opacity: 0.92;
        }

        .confirm-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .checkout-form {
            display: none;
            margin-top: 0.85rem;
            gap: 0.65rem;
        }

        .checkout-form.visible {
            display: grid;
        }

        .checkout-form input,
        .checkout-form textarea {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border-radius: 9px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            font-size: 0.88rem;
            resize: vertical;
        }

        .checkout-form input:focus,
        .checkout-form textarea:focus {
            outline: none;
            border-color: #4b5568;
        }

        .checkout-submit {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 10px;
            background-color: var(--accent-ok);
            color: #0b0d10;
            font-size: 0.9rem;
            font-weight: 800;
        }

        .order-confirmation {
            margin-top: 0.85rem;
            padding: 0.75rem 0.9rem;
            border-radius: 10px;
            background-color: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #86efac;
            font-size: 0.84rem;
            display: none;
        }

        .order-confirmation.visible {
            display: block;
        }

        @media (max-width: 640px) {
            .controls-right {
                justify-content: stretch;
            }
            .search-input {
                max-width: none;
            }
            .specs-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="#" class="brand-logo">Zárate Audio <span>Audio &amp; Más</span></a>
            <button type="button" class="cart-trigger" id="openCartBtn" aria-label="Abrir carrito">
                <span>Carrito</span>
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Sonido claro, directo y sin rodeos</h1>
            <p>Selección esencial de monitores intraurales KZ y audífonos inalámbricos Bluetooth.</p>
        </section>

        <section class="filters-bar" aria-label="Filtros del catálogo">
            <div class="tabs" id="categoryTabs">
                <button type="button" class="tab-btn active" data-category="Todos">Todos</button>
                <button type="button" class="tab-btn" data-category="KZ">IEMs KZ</button>
                <button type="button" class="tab-btn" data-category="Bluetooth">Bluetooth</button>
            </div>

            <div class="controls-right">
                <input
                    type="search"
                    id="searchInput"
                    class="search-input"
                    placeholder="Buscar modelo o marca..."
                    aria-label="Buscar audífonos"
                >
                <select id="brandFilter" class="brand-select" aria-label="Filtrar por marca">
                    <option value="Todas">Todas las marcas</option>
                    <option value="KZ">KZ</option>
                    <option value="Sony">Sony</option>
                    <option value="Apple">Apple</option>
                    <option value="JBL">JBL</option>
                    <option value="Bose">Bose</option>
                    <option value="Sennheiser">Sennheiser</option>
                </select>
            </div>
        </section>

        <section class="products-grid" id="productsGrid" aria-live="polite"></section>
    </main>

    <footer>
        <div class="container">Catálogo esencial de audio personal</div>
    </footer>

    <!-- Modal de especificaciones -->
    <div class="modal-backdrop" id="specModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Especificaciones</h3>
                <button type="button" class="close-btn" id="closeModalBtn" aria-label="Cerrar ventana">&times;</button>
            </div>
            <div class="modal-body" id="modalContent"></div>
        </div>
    </div>

    <!-- Fondo y panel lateral del carrito -->
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="cart-drawer" id="cartDrawer" aria-label="Carrito de compras">
        <div class="drawer-header">
            <h2>Tu carrito</h2>
            <button type="button" class="close-btn" id="closeCartBtn" aria-label="Cerrar carrito">&times;</button>
        </div>
        <div class="drawer-items" id="cartItems"></div>
        <div class="drawer-footer">
            <div class="total-row">
                <span>Total</span>
                <span class="total-amount" id="cartTotal">S/ 0.00</span>
            </div>
            <button type="button" class="confirm-btn" id="confirmOrderBtn" disabled>Confirmar pedido</button>
            <form class="checkout-form" id="checkoutForm">
                <input type="email" id="customerEmail" placeholder="Correo electrónico" aria-label="Correo electrónico" required>
                <input type="tel" id="customerPhone" placeholder="Número de celular" aria-label="Número de celular" required>
                <textarea id="customerAddress" placeholder="Dirección de entrega" aria-label="Dirección de entrega" rows="2" required></textarea>
                <button type="submit" class="checkout-submit">Enviar pedido</button>
            </form>
            <div class="order-confirmation" id="orderConfirmation"></div>
        </div>
    </aside>

    <script>
        // Catálogo curado de 10 productos: 5 IEMs KZ y 5 audífonos Bluetooth
        const PRODUCTS = [
            {
                id: "kz-zs10-pro-x",
                name: "KZ ZS10 Pro X",
                brand: "KZ",
                category: "KZ",
                price: 138.17,
                shortSpec: "1DD + 4BA · 29Ω · Cable 0.75mm",
                description: "Monitor híbrido con driver dinámico de 10 mm y cuatro armaduras balanceadas para graves firmes y agudos definidos.",

                image: "https://cdn.shopify.com/s/files/1/0986/3767/6826/files/QCH24_Black_001_RGB.webp?v=1773407361",
                specs: {

            {
                id: "sennheiser-momentum-4",
                name: "Sennheiser Momentum 4",
                brand: "Sennheiser",
                category: "Bluetooth",
                price: 1036.33,
                shortSpec: "Over-Ear ANC · Hasta 60h batería",
                description: "Firma sonora detallada con transductores de 42 mm, ANC adaptable y hasta 60 horas de reproducción.",
                image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcTcyL_F4KgoP8DhoGqVdafSnReSH1hhS5ekh-Dizysmlr99-X3sHBJEU&s=10",
                specs: {
                    Formato: "Over-Ear inalámbricos",
                    Conectividad: "Bluetooth 5.2 · aptX Adaptive",
                    Batería: "Hasta 60 horas",
                    Extra: "Ecualizador en app"
                }
            }
        ];

        // Estado simple de filtros y carrito
        const state = {
            category: "Todos",
            brand: "Todas",
            search: "",
            cart: []
        };

        // Elementos del DOM
        const productsGrid = document.getElementById("productsGrid");
        const categoryTabs = document.getElementById("categoryTabs");
        const searchInput = document.getElementById("searchInput");
        const brandFilter = document.getElementById("brandFilter");
        const specModal = document.getElementById("specModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalContent = document.getElementById("modalContent");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const cartDrawer = document.getElementById("cartDrawer");
        const drawerBackdrop = document.getElementById("drawerBackdrop");
        const openCartBtn = document.getElementById("openCartBtn");
        const closeCartBtn = document.getElementById("closeCartBtn");
        const cartItemsEl = document.getElementById("cartItems");
        const cartCountEl = document.getElementById("cartCount");
        const cartTotalEl = document.getElementById("cartTotal");
        const confirmOrderBtn = document.getElementById("confirmOrderBtn");
        const orderConfirmationEl = document.getElementById("orderConfirmation");
        const checkoutForm = document.getElementById("checkoutForm");

        function formatPEN(value) {
            return `S/ ${value.toFixed(2)}`;
        }

        // SVG de respaldo automático si falla la carga de imagen externa
        function getFallbackSVG(category) {
            const color = category === "KZ" ? "#f59e0b" : "#38bdf8";
            if (category === "KZ") {
                return `
                    <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
                        <path d="M44 36 C36 18, 76 16, 82 40" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
                        <ellipse cx="34" cy="78" rx="8" ry="12" transform="rotate(-30 34 78)" fill="#1e2430" stroke="#94a3b8" stroke-width="1.6"/>
                        <path d="M44 44 C64 34, 92 46, 94 68 C96 88, 74 100, 54 94 C40 89, 36 70, 40 54 Z" fill="#181d26" stroke="${color}" stroke-width="2.2"/>
                        <circle cx="68" cy="68" r="11" fill="#0d1015" stroke="${color}" stroke-width="1.5"/>
                        <circle cx="68" cy="68" r="4" fill="${color}"/>
                    </svg>
                `;
            }
            return `
                <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
                    <path d="M28 66 C28 32, 92 32, 92 66" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
                    <rect x="20" y="58" width="16" height="30" rx="7" fill="#181d26" stroke="${color}" stroke-width="2"/>
                    <rect x="84" y="58" width="16" height="30" rx="7" fill="#181d26" stroke="${color}" stroke-width="2"/>
                </svg>
            `;
        }

        // Adjunta manejador de error a las imágenes para mostrar el SVG limpio sin romper diseño
        function attachImageFallbacks(container) {
            container.querySelectorAll("img.product-img").forEach((img) => {
                img.addEventListener("error", () => {
                    const cat = img.dataset.category || "Bluetooth";
                    const wrapper = img.parentElement;
                    if (wrapper) {
                        wrapper.innerHTML = getFallbackSVG(cat);
                    }
                }, { once: true });
            });
        }

        function getFilteredProducts() {
            const term = state.search.trim().toLowerCase();
            return PRODUCTS.filter((item) => {
                const matchCategory = state.category === "Todos" || item.category === state.category;
                const matchBrand = state.brand === "Todas" || item.brand === state.brand;
                const matchSearch =
                    !term ||
                    item.name.toLowerCase().includes(term) ||
                    item.brand.toLowerCase().includes(term) ||
                    item.shortSpec.toLowerCase().includes(term);
                return matchCategory && matchBrand && matchSearch;
            });
        }

        function renderProducts() {
            const list = getFilteredProducts();
            if (list.length === 0) {
                productsGrid.innerHTML = `<div class="empty-msg">No hay audífonos que coincidan con el filtro actual.</div>`;
                return;
            }

            productsGrid.innerHTML = list.map((item) => {
                const isKZ = item.category === "KZ";
                const tagClass = isKZ ? "tag-kz" : "tag-bt";
                const addBtnClass = isKZ ? "btn-add-kz" : "btn-add-bt";
                const tagLabel = isKZ ? "IEM KZ" : "Bluetooth";

                return `
                    <article class="product-card">
                        <div class="product-media">
                            <img
                                class="product-img"
                                src="${item.image}"
                                alt="${item.name}"
                                data-category="${item.category}"
                                loading="lazy"
                            >
                        </div>
                        <div class="product-body">
                            <div class="card-meta">
                                <span class="category-tag ${tagClass}">${tagLabel}</span>
                                <span class="product-brand">${item.brand}</span>
                            </div>
                            <h2 class="product-title">${item.name}</h2>
                            <p class="product-spec">${item.shortSpec}</p>
                            <div class="card-footer">
                                <span class="product-price">${formatPEN(item.price)}</span>
                                <div class="card-actions">
                                    <button type="button" class="btn-spec" onclick="openSpecModal('${item.id}')">Ver</button>
                                    <button type="button" class="btn-add ${addBtnClass}" onclick="addToCart('${item.id}')">+ Carrito</button>
                                </div>
                            </div>
                        </div>
                    </article>
                `;
            }).join("");

            attachImageFallbacks(productsGrid);
        }

        function openSpecModal(productId) {
            const product = PRODUCTS.find((p) => p.id === productId);
            if (!product) return;

            const isKZ = product.category === "KZ";
            const addBtnClass = isKZ ? "btn-add-kz" : "btn-add-bt";
            const specRows = Object.entries(product.specs)
                .map(([label, val]) => `<li><span>${label}</span><strong>${val}</strong></li>`)
                .join("");

            modalTitle.textContent = product.name;
            modalContent.innerHTML = `
                <div class="modal-preview">
                    <img
                        class="product-img"
                        src="${product.image}"
                        alt="${product.name}"
                        data-category="${product.category}"
                    >
                </div>
                <p class="modal-desc">${product.description}</p>
                <ul class="specs-list">${specRows}</ul>
                <div class="modal-actions">
                    <span class="modal-price">${formatPEN(product.price)}</span>
                    <button type="button" class="modal-add-btn ${addBtnClass}" onclick="addToCart('${product.id}'); closeSpecModal();">
                        + Carrito
                    </button>
                </div>
            `;

            attachImageFallbacks(modalContent);
            specModal.classList.add("open");
        }

        function closeSpecModal() {
            specModal.classList.remove("open");
        }

        function openCart() {
            cartDrawer.classList.add("open");
            drawerBackdrop.classList.add("open");
        }

        function closeCart() {
            cartDrawer.classList.remove("open");
            drawerBackdrop.classList.remove("open");
        }

        function addToCart(productId) {
            const product = PRODUCTS.find((p) => p.id === productId);
            if (!product) return;

            orderConfirmationEl.classList.remove("visible");
            checkoutForm.classList.remove("visible");
            const existing = state.cart.find((item) => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                state.cart.push({
                    id: product.id,
                    name: product.name,
                    brand: product.brand,
                    price: product.price,
                    qty: 1
                });
            }
            renderCart();
        }

        function changeQty(productId, delta) {
            const idx = state.cart.findIndex((item) => item.id === productId);
            if (idx === -1) return;

            state.cart[idx].qty += delta;
            if (state.cart[idx].qty <= 0) {
                state.cart.splice(idx, 1);
            }
            renderCart();
        }

        function removeItem(productId) {
            state.cart = state.cart.filter((item) => item.id !== productId);
            renderCart();
        }

        function renderCart() {
            const totalUnits = state.cart.reduce((acc, item) => acc + item.qty, 0);
            const totalAmount = state.cart.reduce((acc, item) => acc + item.price * item.qty, 0);

            cartCountEl.textContent = totalUnits;
            cartTotalEl.textContent = formatPEN(totalAmount);
            confirmOrderBtn.disabled = state.cart.length === 0;

            if (state.cart.length === 0) {
                cartItemsEl.innerHTML = `<div class="cart-empty">Tu carrito está vacío.</div>`;
                return;
            }

            cartItemsEl.innerHTML = state.cart.map((item) => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-sub">${item.brand} · ${formatPEN(item.price * item.qty)}</div>
                    </div>
                    <div class="qty-controls">
                        <button type="button" class="qty-btn" aria-label="Restar cantidad" onclick="changeQty('${item.id}', -1)">-</button>
                        <span class="qty-value">${item.qty}</span>
                        <button type="button" class="qty-btn" aria-label="Sumar cantidad" onclick="changeQty('${item.id}', 1)">+</button>
                        <button type="button" class="remove-btn" aria-label="Eliminar producto" onclick="removeItem('${item.id}')">&times;</button>
                    </div>
                </div>
            `).join("");
        }

        // Eventos de filtros y controles
        categoryTabs.addEventListener("click", (e) => {
            const btn = e.target.closest(".tab-btn");
            if (!btn) return;

            categoryTabs.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            state.category = btn.dataset.category;
            renderProducts();
        });

        searchInput.addEventListener("input", (e) => {
            state.search = e.target.value;
            renderProducts();
        });

        brandFilter.addEventListener("change", (e) => {
            state.brand = e.target.value;
            renderProducts();
        });

        closeModalBtn.addEventListener("click", closeSpecModal);
        specModal.addEventListener("click", (e) => {
            if (e.target === specModal) closeSpecModal();
        });

        openCartBtn.addEventListener("click", openCart);
        closeCartBtn.addEventListener("click", closeCart);
        drawerBackdrop.addEventListener("click", closeCart);

        confirmOrderBtn.addEventListener("click", () => {
            if (state.cart.length === 0) return;
            checkoutForm.classList.add("visible");
            document.getElementById("customerEmail").focus();
        });

        checkoutForm.addEventListener("submit", (e) => {
            e.preventDefault();
            if (state.cart.length === 0) return;

            const totalPaid = state.cart.reduce((acc, item) => acc + item.price * item.qty, 0);
            state.cart = [];
            renderCart();
            checkoutForm.reset();
            checkoutForm.classList.remove("visible");
            orderConfirmationEl.textContent = `Pedido confirmado por ${formatPEN(totalPaid)}. Gracias por comprar en AURA Audio.`;
            orderConfirmationEl.classList.add("visible");
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                closeSpecModal();
                closeCart();
            }
        });

        // Renderizado inicial
        renderProducts();
        renderCart();
    </script>
</body>
</html>
